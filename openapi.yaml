        Só preferências já cadastradas podem ser atualizadas — chave inexistente responde `404`.
      requestBody:
        $ref: '#/components/requestBodies/UpdateSettingRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/SettingOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------- notification ----------
  /v1/notifications:
    get:
      tags: [Notification]
      operationId: listNotifications
      summary: Lista paginada das notificações, da mais nova para a mais antiga
      description: |
        Página de notificações, lidas ou não, ordenadas da mais nova para a mais antiga —
        pensada para um botão "ver mais" no cliente (cada clique pede a próxima `page`).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          $ref: '#/components/responses/NotificationPageOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notifications/unread-count:
    get:
      tags: [Notification]
      operationId: getUnreadCount
      summary: Conta as notificações não-lidas
      responses:
        '200':
          $ref: '#/components/responses/UnreadCountOk'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationIdPathParam'
    post:
      tags: [Notification]
      operationId: markNotificationRead
      summary: Marca uma notificação como lida
      description: |
        Idempotente: marcar de novo uma notificação já lida responde `204`. Um
        `notificationId` inexistente também responde `204` — nada é alterado. `404` só quando
        o `notificationId` não é numérico.
      responses:
        '204':
          $ref: '#/components/responses/NotificationRead'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notifications/read-all:
    post:
      tags: [Notification]
      operationId: markAllNotificationsRead
      summary: Marca todas as notificações como lidas
      responses:
        '204':
          $ref: '#/components/responses/AllNotificationsRead'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  parameters:
    # ---------- comuns ----------
    PageParam:
      name: page
      in: query
      required: false
      description: Número da página (0-based)
      schema:
        $ref: '#/components/schemas/PageNumber'
    SizeParam:
      name: size
      in: query
      required: false
      description: Tamanho da página
      schema:
        $ref: '#/components/schemas/PageSize'
    SearchQueryParam:
      name: q
      in: query
      required: true
      description: Texto de busca, repassado ao upstream (AniList ou TMDB)
      schema:
        $ref: '#/components/schemas/SearchQuery'
    ForceRefreshParam:
      name: forceRefresh
      in: query
      required: false
      description: Se `true`, ignora o cache local e busca de novo no upstream (AniList ou TMDB)
      schema:
        $ref: '#/components/schemas/ForceRefresh'
    NameFilterParam:
      name: name
      in: query
      required: false
      description: >-
        Substring case-insensitive do nome (da pasta ou da chave da preferência); `null`/ausente não
        filtra
      schema:
        $ref: '#/components/schemas/NameFilter'
    FileIdPathParam:
      name: fileId
      in: path
      required: true
      description: Id do arquivo de vídeo no catalog
      schema:
        $ref: '#/components/schemas/FileId'
    FolderIdPathParam:
      name: folderId
      in: path
      required: true
      description: Id da pasta no catalog
      schema:
        $ref: '#/components/schemas/FolderId'
    StorageProviderIdPathParam:
      name: providerId
      in: path
      required: true
      description: Id do storage provider
      schema:
        $ref: '#/components/schemas/StorageProviderId'

    # ---------- ingestion ----------
    RootPathParam:
      name: rootPath
      in: query
      required: false
      description: Prefixo do subtree; ausente ou vazio parte da raiz do provider
      schema:
        $ref: '#/components/schemas/RootPath'

    # ---------- catalog ----------
    MediaTypeFilterParam:
      name: mediaType
      in: query
      required: false
      description: Tipo do conteúdo; `null`/ausente não filtra
      schema:
        $ref: '#/components/schemas/MediaType'
    StorageProviderIdFilterParam:
      name: storageProviderId
      in: query
      required: false
      description: Provider dono; `null`/ausente não filtra
      schema:
        $ref: '#/components/schemas/StorageProviderId'
    ParentIdFilterParam:
      name: parentId
      in: query
      required: false
      description: Pasta pai; `null`/ausente não filtra
      schema:
        $ref: '#/components/schemas/FolderId'
    HasFilesFilterParam:
      name: hasFiles
      in: query
      required: false
      description: Filtra por existência de arquivos; `null`/ausente não filtra
      schema:
        $ref: '#/components/schemas/HasFilesFilter'
    ReviewStatusFilterParam:
      name: reviewStatus
      in: query
      required: false
      description: Status de revisão do anime vinculado; `null`/ausente não filtra
      schema:
        $ref: '#/components/schemas/AnimeReviewStatus'
    HasAnilistFilterParam:
      name: hasAnilist
      in: query
      required: false
      description: Filtra por ter ou não anime vinculado à AniList; `null`/ausente não filtra
      schema:
        $ref: '#/components/schemas/HasAnilistFilter'
    HasTmdbFilterParam:
      name: hasTmdb
      in: query
      required: false
      description: Filtra por ter ou não binding TMDB; `null`/ausente não filtra
      schema:
        $ref: '#/components/schemas/HasTmdbFilter'
    AllEpisodesPairedFilterParam:
      name: allEpisodesPaired
      in: query
      required: false
      description: >-
        Filtra por ter todo arquivo pareado ao TMDB; pastas sem nenhum arquivo não batem com
        nenhum dos dois valores; `null`/ausente não filtra
      schema:
        $ref: '#/components/schemas/AllEpisodesPairedFilter'
    SortParam:
      name: sort
      in: query
      required: false
      description: |
        Specs de ordenação `field[:asc|desc]`. Whitelist: `name`, `createdAt`. Múltiplos
        valores viram lista ordenada.
      explode: true
      schema:
        $ref: '#/components/schemas/SortSpecs'
    FolderIdRequiredParam:
      name: folderId
      in: query
      required: true
      description: Id da pasta cujos arquivos serão listados
      schema:
        $ref: '#/components/schemas/FolderId'

    # ---------- cache ----------
    PendingOnlyFilterParam:
      name: pendingOnly
      in: query
      required: false
      description: Restringe às linhas com status diferente de `COMPLETED`; `null`/ausente não filtra
      schema:
        $ref: '#/components/schemas/PendingOnlyFilter'
    CacheItemIdPathParam:
      name: itemId
      in: path
      required: true
      description: Id da linha do cache
      schema:
        $ref: '#/components/schemas/CacheItemId'

    # ---------- playback ----------
    SessionIdPathParam:
      name: sessionId
      in: path
      required: true
      description: Id da sessão de playback (UUID gerado ao iniciar o transcode)
      schema:
        $ref: '#/components/schemas/SessionId'
    MediaFilePathParam:
      name: file
      in: path
      required: true
      description: |
        Nome de um arquivo referenciado pela playlist da sessão (ver `MediaFileName`). Qualquer
        outro nome responde `404`.
      schema:
        $ref: '#/components/schemas/MediaFileName'

    # ---------- tmdb ----------
    LanguageParam:
      name: language
      in: query
      required: false
      description: >-
        Idioma dos textos devolvidos, como tag BCP 47 (ex.: `en-US`, `pt-BR`). Omitido, usa a
        preferência `tmdb.default-language`.
      schema:
        $ref: '#/components/schemas/Language'

    # ---------- animemetadata ----------
    AnilistIdPathParam:
      name: anilistId
      in: path
      required: true
      description: ID do anime na AniList
      schema:
        $ref: '#/components/schemas/AnilistId'
    DepthParam:
      name: depth
      in: query
      required: false
      description: Profundidade máxima da BFS
      schema:
        $ref: '#/components/schemas/GraphDepth'

    # ---------- settings ----------
    SettingKeyPathParam:
      name: key
      in: path
      required: true
      description: 'Chave da preferência (ex.: `cache.max-size-bytes`)'
      schema:
        $ref: '#/components/schemas/SettingKey'

    # ---------- notification ----------
    NotificationIdPathParam:
      name: notificationId
      in: path
      required: true
      description: Id da notificação
      schema:
        type: integer
        format: int32

  requestBodies:
    # ---------- storageprovider ----------
    CreateStorageProviderRequestBody:
      description: Payload de criação — type + config em claro
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateStorageProviderRequest'
    UpdateStorageProviderConfigRequestBody:
      description: Payload de atualização de config em claro
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateStorageProviderConfigRequest'

    # ---------- ingestion ----------
    IngestSubtreeRequestBody:
      description: Payload de ingestão — subtree + mediaType a aplicar
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IngestSubtreeRequest'

    # ---------- catalog ----------
    MediaFolderRequestBody:
      description: Payload de criação/atualização de pasta
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaFolderRequest'
    VideoFileRequestBody:
      description: Payload de criação/atualização de arquivo
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VideoFileRequest'

    # ---------- cache ----------
    CacheQueueRequestBody:
      description: Arquivo a ser cacheado
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CacheQueueRequest'

    # ---------- playback ----------
    StartPlaybackSessionRequestBody:
      description: Arquivo, perfil e faixas da sessão a iniciar
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StartPlaybackSessionRequest'
    SeekRequestBody:
      description: Nova posição do transcode
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SeekRequest'
    SwitchTracksRequestBody:
      description: Nova posição e faixas de áudio/legenda da sessão
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SwitchTracksRequest'

    # ---------- animemetadata ----------
    AnimeBindingRequestBody:
      description: Payload de binding anime↔pasta
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnimeBindingRequest'
    AnimeFranchiseRootRequestBody:
      description: Payload de curadoria da flag
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnimeFranchiseRootRequest'
    TmdbBindingRequestBody:
      description: Payload de binding anime↔TMDB
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TmdbBindingRequest'
    TmdbOverridesRequestBody:
      description: Payload de overrides
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TmdbOverrides'
    TmdbFilePairingRequestBody:
      description: Payload de pairing
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TmdbFilePairingRequest'

    # ---------- settings ----------
    UpdateSettingRequestBody:
      description: Novo valor da preferência
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateSettingRequest'

  responses:
    # ---------- comuns ----------
    BadRequest:
      description: >-
        Payload ou parâmetros inválidos (`VALIDATION_ERROR`), ou regra de negócio violada
        (`BUSINESS_RULE_VIOLATION`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Recurso inexistente (`RESOURCE_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadGateway:
      description: >-
        Falha num sistema externo — AniList, TMDB, rclone ou ffprobe (`INTEGRATION_ERROR`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: >-
        Preferência obrigatória sem valor (`INTEGRATION_NOT_CONFIGURED`) — configure em `PUT
        /v1/settings/{key}`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: Erro inesperado no servidor (`INTERNAL_ERROR`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    # ---------- storageprovider ----------
    StorageProviderPageOk:
      description: Página (possivelmente vazia) de providers
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StorageProviderPage'
    StorageProviderOk:
      description: Provider encontrado/atualizado (sem `config`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StorageProviderResponse'
    StorageProviderCreated:
      description: Provider cadastrado (sem `config`)
      headers:
        Location:
          description: URI do provider recém-criado (`/v1/storage/providers/{providerId}`)
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StorageProviderResponse'
    StorageProviderDeleted:
      description: Provider removido
    StorageProviderHealthOk:
      description: Resultado do teste de conectividade
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StorageProviderHealth'

    # ---------- ingestion ----------
    AvailableFolderNodeOk:
      description: Árvore com o nó raiz e filhos até a folha
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AvailableFolderNode'
    IngestionStarted:
      description: >-
        Ingestão aceita e iniciada em background (ou já em andamento para o mesmo subtree)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IngestionStartedResponse'
    IngestionRemoved:
      description: Subtree removido (inclusive quando nada casa — idempotente)

    # ---------- catalog ----------
    MediaFolderPageOk:
      description: Página (possivelmente vazia) de pastas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaFolderPage'
    MediaFolderOk:
      description: Pasta encontrada/atualizada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaFolderResponse'
    MediaFolderCreated:
      description: Pasta criada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaFolderResponse'
    MediaFolderDeleted:
      description: Pasta removida
    VideoFilePageOk:
      description: Página (possivelmente vazia) de arquivos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VideoFilePage'
    VideoFileOk:
      description: Arquivo encontrado/atualizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VideoFileResponse'
    VideoFileCreated:
      description: Arquivo criado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VideoFileResponse'
    VideoFileDeleted:
      description: Arquivo removido

    # ---------- cache ----------
    CacheItemCreated:
      description: Linha enfileirada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CacheItem'
    CacheItemPageOk:
      description: Página (possivelmente vazia) de linhas do cache
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CacheItemPage'
    CacheItemDeleted:
      description: Linha removida do cache (cancelada, ou com o arquivo apagado do disco)

    # ---------- mediaprobe ----------
    MediaProbeOk:
      description: Probe extraído do arquivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaInfoResponse'

    # ---------- playback ----------
    SessionCreated:
      description: Sessão de transcode criada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlaybackSessionResponse'
    SessionOk:
      description: Sessão atualizada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlaybackSessionResponse'
    MediaFileOk:
      description: |
        Arquivo HLS — segmento MPEG-TS/fMP4, init segment fMP4, variant playlist (`.m3u8`) ou
        segmento de legenda WebVTT (`.vtt`).
      content:
        video/mp2t:
          schema:
            $ref: '#/components/schemas/MediaFileContent'
        video/mp4:
          schema:
            $ref: '#/components/schemas/MediaFileContent'
        application/vnd.apple.mpegurl:
          schema:
            $ref: '#/components/schemas/MediaFileContent'
        text/vtt:
          schema:
            $ref: '#/components/schemas/MediaFileContent'
    PlaylistOk:
      description: Playlist HLS da sessão
      headers:
        X-Playback-Heartbeat-Ttl-Seconds:
          description: |
            TTL do heartbeat em segundos — em quanto tempo o cliente deve pingar de novo para não
            deixar a sessão expirar. Mesma semântica do `expiresInSeconds` do heartbeat.
          schema:
            type: integer
            format: int64
            minimum: 0
      content:
        application/vnd.apple.mpegurl:
          schema:
            $ref: '#/components/schemas/M3u8Playlist'
    HeartbeatOk:
      description: Sessão renovada; validade restante
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionHeartbeat'

    # ---------- anilist ----------
    AnilistMediaSummaryPageOk:
      description: Página (possivelmente vazia) com os resultados da busca
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnilistMediaSummaryPage'

    # ---------- tmdb ----------
    TmdbMovieSearchResultPageOk:
      description: Página (possivelmente vazia) de resultados de filmes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TmdbMovieSearchResultPage'
    TmdbTvSearchResultPageOk:
      description: Página (possivelmente vazia) de resultados de séries
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TmdbTvSearchResultPage'

    # ---------- animemetadata ----------
    AnimeOk:
      description: Vista pública do anime
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnimeResponse'
    AnimePageOk:
      description: Página (possivelmente vazia) de animes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnimePage'
    AnimeCreated:
      description: Metadata do anime criada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnimeResponse'
    AnimeDeleted:
      description: Metadata do anime removida
    AnimeRelationGraphOk:
      description: Grafo (nodes + edges) alcançado a partir da raiz
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnimeRelationGraphResponse'
    TmdbAnimeStateOk:
      description: Estado TMDB atual
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TmdbAnimeStateResponse'
    TmdbAnimeStateCreated:
      description: Binding TMDB criado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TmdbAnimeStateResponse'
    TmdbBindingDeleted:
      description: Binding TMDB removido
    TmdbOverridesSchemaOk:
      description: Opções concretas por campo (traduções e imagens do TMDB)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TmdbOverridesSchema'
    TmdbFilePairingSchemaOk:
      description: Temporadas e episódios da série TMDB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TmdbFilePairingSchema'
    TmdbFilePairingOk:
      description: Pairing atual (ou estado vazio se nunca houve pairing)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TmdbFilePairingResponse'
    TmdbFilePairingDeleted:
      description: Pairing removido

    # ---------- settings ----------
    SettingListOk:
      description: Lista (possivelmente vazia) de preferências
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SettingList'
    SettingOk:
      description: Preferência atualizada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SettingResponse'

    # ---------- notification ----------
    NotificationPageOk:
      description: Página (possivelmente vazia) de notificações
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotificationPage'
    UnreadCountOk:
      description: Contagem de não-lidas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnreadCountResponse'
    NotificationRead:
      description: Notificação marcada como lida
    AllNotificationsRead:
      description: Todas as notificações marcadas como lidas

  schemas:
    # ---------- comuns ----------
    FileId:
      type: integer
      format: int32
      description: Id do arquivo de vídeo no catalog

    FolderId:
      type: integer
      format: int32
      description: Id da pasta no catalog

    StorageProviderId:
      type: integer
      format: int32
      description: Id do storage provider

    AnilistId:
      type: integer
      format: int32
      description: ID do anime na AniList — chave primária do anime no akari

    TmdbId:
      type: integer
      format: int32
      description: Id de um recurso no TMDB (série ou filme)

    PageNumber:
      type: integer
      format: int32
      default: 0
      description: Número da página (0-based)

    PageSize:
      type: integer
      format: int32
      default: 12
      description: Tamanho máximo de itens por página

    PageTotalElements:
      type: integer
      format: int64
      description: Total absoluto de elementos que existem para a query

    PageTotalPages:
      type: integer
      format: int32
      description: Total de páginas calculado a partir de totalElements e size

    Page:
      type: object
      description: |
        Metadados de paginação, comuns a todo envelope paginado. Cada envelope
        (`MediaFolderPage`, `CacheItemPage`, ...) compõe este schema com o array `data` do seu tipo.
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          $ref: '#/components/schemas/PageNumber'
        size:
          $ref: '#/components/schemas/PageSize'
        totalElements:
          $ref: '#/components/schemas/PageTotalElements'
        totalPages:
          $ref: '#/components/schemas/PageTotalPages'

    NameFilter:
      type: string
      description: Substring case-insensitive aplicada ao nome

    SearchQuery:
      type: string
      minLength: 1
      description: Texto de busca (obrigatório, não vazio)

    ForceRefresh:
      type: boolean
      default: false
      description: Ignora o cache quando `true`

    MediaType:
      type: string
      description: |
        Tipo do conteúdo abrigado por uma pasta. Gravado na pasta quando ela é criada (pela
        ingestão ou pelo `POST /v1/catalog/folders`); a ingestão não altera pastas já registradas.
      enum:
        - ANIME
        - TV
        - MOVIE

    ErrorDetail:
      type: object
      description: Violação de um campo — só aparece em erros `VALIDATION_ERROR`
      required: [field, error]
      properties:
        field:
          type: string
          description: >-
            Campo violado: caminho em dot-notation quando está no body (ex.: `config.password`) ou o
            nome do parâmetro (ex.: `size`)
        error:
          type: string
          description: Mensagem legível da violação

    ApiErrorCode:
      type: string
      description: |
        Chave estável do erro — o cliente chaveia o tratamento por ela, nunca pelo `message`.

        - `VALIDATION_ERROR` (400): payload ou parâmetros inválidos (Bean Validation ou JSON
          malformado); `details` lista as violações.
        - `BUSINESS_RULE_VIOLATION` (400): o input é válido na forma, mas fere uma regra de
          negócio.
        - `RESOURCE_NOT_FOUND` (404): o recurso não existe (ou a rota não existe / um
          parâmetro de path não pôde ser convertido).
        - `REQUEST_ERROR` (405, 406, 415, ...): requisição incompatível com o endpoint —
          método, `Content-Type` ou `Accept` não suportados.
        - `INTEGRATION_ERROR` (502): um sistema externo (AniList, TMDB, rclone, ffprobe)
          falhou ou está indisponível.
        - `INTEGRATION_NOT_CONFIGURED` (503): uma preferência obrigatória está sem valor —
          o admin precisa configurá-la em
          `PUT /v1/settings/{key}`.
        - `INTERNAL_ERROR` (500): erro inesperado no servidor.
      enum:
        - VALIDATION_ERROR
        - BUSINESS_RULE_VIOLATION
        - RESOURCE_NOT_FOUND
        - REQUEST_ERROR
        - INTEGRATION_ERROR
        - INTEGRATION_NOT_CONFIGURED
        - INTERNAL_ERROR

    ApiError:
      type: object
      description: |
        Shape uniforme de erro da API, produzido pelos `ExceptionMapper`s globais. Todo status
        de erro (4xx/5xx) devolve este corpo.
      required: [status, code, message, details]
      properties:
        status:
          type: integer
          format: int32
          description: HTTP status devolvido (o mesmo da resposta)
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        message:
          type: string
          description: Mensagem legível para logging/exibição
        details:
          type: array
          description: Violações por campo; vazia quando `code` não é `VALIDATION_ERROR`
          items:
            $ref: '#/components/schemas/ErrorDetail'

    # ---------- storageprovider ----------
    StorageProviderType:
      type: string
      description: |
        Tipo do provider. Cada valor implica um schema de `config` distinto (ex.: `MEGA`
        exige `email`+`password`; `LOCAL` exige `rootPath`). Novos providers vão surgir aqui
        à medida que forem suportados.
      enum:
        - MEGA
        - LOCAL

    StorageProviderConfig:
      type: object
      description: |
        Configuração do provider — mapa livre de string→string. O conjunto de chaves
        obrigatórias depende de `type`. Para `MEGA`: `email` (obrigatório), `password`
        (obrigatório, será obscurecido antes de persistir). Para `LOCAL`: `rootPath`
        (obrigatório, diretório raiz absoluto dos arquivos no disco do servidor).
      additionalProperties:
        type: string

    CreateStorageProviderRequest:
      type: object
      description: Payload de `POST /v1/storage/providers`
      required: [type, config]
      properties:
        type:
          $ref: '#/components/schemas/StorageProviderType'
        config:
          $ref: '#/components/schemas/StorageProviderConfig'

    UpdateStorageProviderConfigRequest:
      type: object
      description: Payload de `PUT /v1/storage/providers/{providerId}/config`
      required: [config]
      properties:
        config:
          $ref: '#/components/schemas/StorageProviderConfig'

    StorageProviderResponse:
      type: object
      description: |
        Vista pública do provider. `config` é intencionalmente omitido para evitar
        vazar credenciais (mesmo obscurecidas) para clientes da API.
      required: [id, type, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/StorageProviderId'
        type:
          $ref: '#/components/schemas/StorageProviderType'
        createdAt:
          type: string
          format: date-time

    StorageProviderHealth:
      type: object
      description: Resultado do teste de conectividade com o provider
      required: [healthy]
      properties:
        healthy:
          type: boolean
          description: '`true` se o provider respondeu; `false` se está inacessível'

    StorageProviderPage:
      description: Envelope paginado de providers
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/StorageProviderResponse'

    # ---------- ingestion ----------
    RootPath:
      type: string
      description: Caminho relativo à raiz do provider

    IngestSubtreeRequest:
      type: object
      description: Payload de `POST /v1/ingestion/providers/{providerId}`
      required: [mediaType]
      properties:
        rootPath:
          allOf: [{ $ref: '#/components/schemas/RootPath' }]
          nullable: true
          description: '`null` ou vazio ingere a raiz inteira do provider'
        mediaType:
          $ref: '#/components/schemas/MediaType'

    IngestionStartedResponse:
      type: object
      description: Confirmação de que a ingestão em background foi aceita
      required: [status]
      properties:
        status:
          type: string
          description: Status do disparo — hoje sempre `started`
          enum:
            - started

    AvailableFolderNode:
      type: object
      description: |
        Nó da árvore de pastas disponíveis. Recursivo — cada nó tem `children` com os
        filhos diretos. Os nós carregam o status `ingested` para o frontend destacar
        visualmente o que já está no catalog.
      required: [name, path, ingested, children]
      properties:
        name:
          type: string
          description: Último segmento do path
        path:
          type: string
          description: Caminho relativo à raiz do provider
        ingested:
          type: boolean
          description: '`true` se essa pasta já está catalogada'
        children:
          type: array
          description: Filhos diretos
          items:
            $ref: '#/components/schemas/AvailableFolderNode'

    # ---------- catalog ----------
    HasFilesFilter:
      type: boolean
      description: Restringe por existência de arquivos

    HasAnilistFilter:
      type: boolean
      description: Restringe por ter ou não anime vinculado à AniList

    HasTmdbFilter:
      type: boolean
      description: >-
        Restringe por ter ou não binding TMDB; independe de `hasAnilist` — combine os dois
        pra achar só pastas com AniList vinculada mas sem TMDB

    AllEpisodesPairedFilter:
      type: boolean
      description: >-
        Restringe por ter todo arquivo de vídeo pareado ao TMDB; pastas sem nenhum arquivo
        não batem nem com `true` nem com `false`

    SortSpecs:
      type: array
      description: Lista de specs de ordenação `field[:asc|desc]`
      items:
        $ref: '#/components/schemas/SortSpec'

    SortSpec:
      type: string
      description: Spec de ordenação individual — formato `field` ou `field:asc|desc`

    MediaFolderRequest:
      type: object
      description: |
        Payload de criação e atualização de pasta. No PUT o id vem do path (`folderId`);
        `createdAt` é gerado pelo banco. A pasta pai é derivada do `path` (o pai é a pasta do
        mesmo provider cujo path é o `path` sem o último segmento; raiz se não houver) — não é
        informada no payload.
      required: [storageProviderId, mediaType, name, path]
      properties:
        storageProviderId:
          allOf: [{ $ref: '#/components/schemas/StorageProviderId' }]
          description: Id do provider onde a pasta vive
        mediaType:
          $ref: '#/components/schemas/MediaType'
        name:
          type: string
          minLength: 1
          description: Último segmento do path (nome exibido da pasta)
        path:
          type: string
          minLength: 1
          description: Caminho relativo à raiz do provider

    MediaFolderResponse:
      type: object
      description: Vista pública de uma pasta ingerida
      required: [id, storageProviderId, mediaType, name, path, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/FolderId'
        storageProviderId:
          $ref: '#/components/schemas/StorageProviderId'
        parentId:
          allOf: [{ $ref: '#/components/schemas/FolderId' }]
          nullable: true
          description: '`null` quando a pasta é raiz'
        mediaType:
          $ref: '#/components/schemas/MediaType'
        name:
          type: string
        path:
          type: string
        createdAt:
          type: string
          format: date-time
        hasFiles:
          type: boolean
          nullable: true
          description: >-
            `true` se a pasta tem ao menos um arquivo de vídeo direto. Enriquecido só na listagem
            (`GET /folders`); `null` nas leituras que não computam esse campo.
        animeBinding:
          allOf: [{ $ref: '#/components/schemas/AnimeBindingSummary' }]
          nullable: true
          description: >-
            Binding de anime da pasta, quando houver. Enriquecido só na listagem
            (`GET /folders`); `null` nas leituras que não computam esse campo.

    MediaFolderPage:
      description: Envelope paginado de pastas
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/MediaFolderResponse'

    VideoFileRequest:
      type: object
      description: |
        Payload de criação e atualização de arquivo. O `path` é derivado server-side a
        partir da pasta pai + `name`.
      required: [folderId, name]
      properties:
        folderId:
          $ref: '#/components/schemas/FolderId'
        name:
          type: string
          minLength: 1
          description: Nome do arquivo (último segmento do path)
        sizeBytes:
          allOf: [{ $ref: '#/components/schemas/FileSizeBytes' }]
          nullable: true
          description: Tamanho em bytes; `null` quando o provider não expõe
        format:
          allOf: [{ $ref: '#/components/schemas/FileFormat' }]
          nullable: true
          description: '`null` se não detectado'

    VideoFileResponse:
      type: object
      description: Vista pública de um arquivo ingerido
      required: [id, folderId, name, path, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/FileId'
        folderId:
          $ref: '#/components/schemas/FolderId'
        name:
          type: string
        path:
          type: string
        sizeBytes:
          allOf: [{ $ref: '#/components/schemas/FileSizeBytes' }]
          nullable: true
        format:
          allOf: [{ $ref: '#/components/schemas/FileFormat' }]
          nullable: true
        createdAt:
          type: string
          format: date-time
        tmdbPairing:
          allOf: [{ $ref: '#/components/schemas/TmdbFilePairingResponse' }]
          nullable: true
          description: >-
            Pairing TMDB do arquivo, quando houver. Enriquecido só na listagem
            (`GET /video-files`); `null` nas leituras que não computam esse campo.

    VideoFilePage:
      description: Envelope paginado de arquivos
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/VideoFileResponse'

    FileSizeBytes:
      type: integer
      format: int64
      description: Tamanho de arquivo em bytes

    FileFormat:
      type: string
      description: 'Extensão/formato do arquivo (ex.: `mkv`, `mp4`)'

    # ---------- cache ----------
    CacheStatus:
      type: string
      description: Estado da linha no ciclo de download
      enum:
        - QUEUED
        - DOWNLOADING
        - COMPLETED
        - FAILED

    PendingOnlyFilter:
      type: boolean
      description: Restringe às linhas com status diferente de `COMPLETED`

    CacheQueueRequest:
      type: object
      description: Pedido de enfileiramento de download
      required: [fileId]
      properties:
        fileId:
          $ref: '#/components/schemas/FileId'

    CacheItemId:
      type: string
      format: uuid
      description: |
        Id da linha do cache, gerado ao enfileirar — também é o nome do arquivo em disco.
        Reenfileirar um item `FAILED` reaproveita o mesmo id.

    CacheItem:
      type: object
      description: Linha do cache com o arquivo resolvido
      required: [id, status, queuedAt]
      properties:
        id:
          $ref: '#/components/schemas/CacheItemId'
        status:
          $ref: '#/components/schemas/CacheStatus'
        jobId:
          type: integer
          format: int64
          nullable: true
          description: Id do job rclone; `null` fora de `DOWNLOADING`
        queuedAt:
          type: string
          format: date-time
          description: Momento em que a linha entrou na fila
        videoFile:
          allOf: [{ $ref: '#/components/schemas/VideoFileResponse' }]
          nullable: true
          description: Arquivo do catalog a que a linha se refere

    CacheItemPage:
      description: Envelope paginado das linhas do cache
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CacheItem'

    # ---------- mediaprobe ----------
    MediaContainer:
      type: object
      description: Metadados do container (bloco `format` do ffprobe)
      properties:
        formatName:
          type: string
          nullable: true
          description: >-
            Nome curto do formato no ffprobe (ex.: `matroska,webm`, `mov,mp4,m4a,3gp,3g2,mj2`)
        formatLongName:
          type: string
          nullable: true
          description: 'Nome legível do formato (ex.: `Matroska / WebM`)'
        durationSeconds:
          type: number
          format: double
          nullable: true
          description: Duração total da mídia, em segundos
        sizeBytes:
          type: integer
          format: int64
          nullable: true
          description: Tamanho do arquivo, em bytes
        bitRate:
          type: integer
          format: int64
          nullable: true
          description: Bitrate total do container, em bits por segundo

    VideoTrack:
      type: object
      description: Faixa de vídeo
      properties:
        index:
          $ref: '#/components/schemas/StreamIndex'
        codec:
          type: string
          nullable: true
          description: 'Codec no nome do ffprobe (ex.: `h264`, `hevc`, `av1`)'
        width:
          type: integer
          format: int32
          nullable: true
          description: Largura, em pixels
        height:
          type: integer
          format: int32
          nullable: true
          description: Altura, em pixels
        displayAspectRatio:
          type: string
          nullable: true
          description: 'Proporção de exibição (ex.: `16:9`)'
        frameRate:
          type: number
          format: double
          nullable: true
          description: >-
            Quadros por segundo, calculado do `avg_frame_rate` do ffprobe (ex.: `23.976`)
        bitRate:
          type: integer
          format: int64
          nullable: true
          description: >-
            Bitrate da faixa, em bits por segundo; `null` quando o container não informa por faixa
        pixFmt:
          type: string
          nullable: true
          description: 'Formato de pixel (ex.: `yuv420p`, `yuv420p10le`)'
        profile:
          type: string
          nullable: true
          description: 'Profile do codec (ex.: `High`, `Main 10`)'
        language:
          $ref: '#/components/schemas/TrackLanguage'
        title:
          $ref: '#/components/schemas/TrackTitle'
        defaultTrack:
          $ref: '#/components/schemas/TrackDefault'

    AudioTrack:
      type: object
      description: |
        Faixa de áudio. A posição dela no array `audio` (0-based) é o valor a mandar em
        `audioTrackIndex` ao iniciar uma sessão de playback — **não** o campo `index`.
      properties:
        index:
          $ref: '#/components/schemas/StreamIndex'
        codec:
          type: string
          nullable: true
          description: 'Codec no nome do ffprobe (ex.: `aac`, `flac`, `opus`)'
        channels:
          type: integer
          format: int32
          nullable: true
          description: Número de canais
        channelLayout:
          type: string
          nullable: true
          description: 'Layout dos canais (ex.: `stereo`, `5.1`)'
        sampleRate:
          type: integer
          format: int32
          nullable: true
          description: Taxa de amostragem, em Hz
        bitRate:
          type: integer
          format: int64
          nullable: true
          description: >-
            Bitrate da faixa, em bits por segundo; `null` quando o container não informa por faixa
        language:
          $ref: '#/components/schemas/TrackLanguage'
        title:
          $ref: '#/components/schemas/TrackTitle'
        defaultTrack:
          $ref: '#/components/schemas/TrackDefault'

    SubtitleTrack:
      type: object
      description: |
        Faixa de legenda. A posição dela no array `subtitles` (0-based) é o valor a mandar em
        `subtitleTrackIndex` ao iniciar uma sessão de playback — **não** o campo `index`.
      properties:
        index:
          $ref: '#/components/schemas/StreamIndex'
        codec:
          type: string
          nullable: true
          description: |
            Codec no nome do ffprobe (ex.: `subrip`, `ass`). No playback, `subrip`/`srt` vira
            legenda soft (WebVTT) e os demais são queimados no vídeo.
        language:
          $ref: '#/components/schemas/TrackLanguage'
        title:
          $ref: '#/components/schemas/TrackTitle'
        defaultTrack:
          $ref: '#/components/schemas/TrackDefault'
        forced:
          type: boolean
          nullable: true
          description: >-
            `true` se a faixa é "forçada" (só traduz falas em outro idioma ou letreiros)
        hearingImpaired:
          type: boolean
          nullable: true
          description: >-
            `true` se a faixa é para deficientes auditivos (SDH/CC — descreve sons além das falas)

    StreamIndex:
      type: integer
      format: int32
      description: |
        Índice global do stream no arquivo (campo `index` do ffprobe), contando todos os tipos.
        Serve para identificar a faixa; para escolher faixas no playback use a posição no array.

    TrackLanguage:
      type: string
      nullable: true
      description: >-
        Tag `language` do arquivo, normalmente ISO 639-2 (ex.: `jpn`, `eng`); `null` se ausente

    TrackTitle:
      type: string
      nullable: true
      description: 'Tag `title` do arquivo (ex.: `Japanese 5.1`); `null` se ausente'

    TrackDefault:
      type: boolean
      nullable: true
      description: '`true` se a faixa está marcada como padrão no arquivo'

    MediaInfoResponse:
      type: object
      description: Metadados técnicos da mídia, com as faixas separadas por tipo na ordem do arquivo
      required: [container, video, audio, subtitles]
      properties:
        container:
          $ref: '#/components/schemas/MediaContainer'
        video:
          type: array
          items:
            $ref: '#/components/schemas/VideoTrack'
        audio:
          type: array
          items:
            $ref: '#/components/schemas/AudioTrack'
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleTrack'

    # ---------- playback ----------
    SessionId:
      type: string
      format: uuid
      description: Identificador da sessão de playback

    StartPlaybackSessionRequest:
      type: object
      description: Parâmetros para iniciar uma sessão de transcode
      required: [fileId, profile, audioTrackIndex]
      properties:
        fileId:
          $ref: '#/components/schemas/FileId'
        profile:
          type: string
          description: |
            Profile de transcode escolhido pelo cliente. Os valores válidos são os profiles de
            transcode suportados pelo backend; um valor desconhecido é rejeitado com `400`.
        audioTrackIndex:
          type: integer
          format: int32
          minimum: 0
          description: |
            Posição (0-based) da faixa no array `audio` do `GET /v1/mediaprobe/files/{fileId}` —
            **não** o campo `index` da faixa, que é o índice global do stream no arquivo.
        subtitleTrackIndex:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: |
            Posição (0-based) da faixa no array `subtitles` do `GET /v1/mediaprobe/files/{fileId}`
            — **não** o campo `index` da faixa. Legendas SRT viram faixa WebVTT soft
            (selecionável no player); ASS e demais formatos são queimados no vídeo (hardsub).
            Ausente/`null` reproduz sem legenda.

    SeekRequest:
      type: object
      description: Nova posição do transcode
      required: [positionSeconds]
      properties:
        positionSeconds:
          type: number
          format: double
          minimum: 0
          description: Instante alvo, em segundos a partir do início da mídia

    SwitchTracksRequest:
      type: object
      description: Nova posição e faixas de áudio/legenda do transcode
      required: [positionSeconds, audioTrackIndex]
      properties:
        positionSeconds:
          type: number
          format: double
          minimum: 0
          description: Instante alvo, em segundos a partir do início da mídia
        audioTrackIndex:
          type: integer
          format: int32
          minimum: 0
          description: |
            Posição (0-based) da faixa no array `audio` do `GET /v1/mediaprobe/files/{fileId}` —
            **não** o campo `index` da faixa. Mesma semântica de `StartPlaybackSessionRequest`.
        subtitleTrackIndex:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: |
            Posição (0-based) da faixa no array `subtitles` do `GET /v1/mediaprobe/files/{fileId}`
            — **não** o campo `index` da faixa. Ausente/`null` reproduz sem legenda. Mesma
            semântica de `StartPlaybackSessionRequest`.

    PlaybackSessionResponse:
      type: object
      description: Sessão de playback recém-iniciada ou reposicionada
      required: [sessionId, playlistUrl, startOffsetSeconds]
      properties:
        sessionId:
          $ref: '#/components/schemas/SessionId'
        playlistUrl:
          type: string
          description: |
            URL (relativa ao host) da playlist `m3u8` da sessão — atalho para o endpoint
            `GET /v1/playback/sessions/{sessionId}/playlist.m3u8`.
        startOffsetSeconds:
          type: number
          format: double
          minimum: 0
          description: |
            Posição de mídia, em segundos, que corresponde ao início da playlist (`currentTime 0`). O
            cliente mapeia a posição local com base nela (`currentTime = alvo - startOffsetSeconds`) e
            recarrega a source quando ela muda entre chamadas de seek (indicando que o transcode
            reiniciou num novo offset). `0` no início da mídia.

    M3u8Playlist:
      type: string
      description: Conteúdo da playlist HLS (`m3u8`) em texto

    MediaFileName:
      type: string
      description: |
        Nome de um arquivo HLS da sessão. Formatos aceitos:

        - `segment_N.ts` / `segment_N.m4s` — segmento da rendition única (MPEG-TS ou fMP4);
        - `segment_V_N.ts` / `segment_V_N.m4s` — segmento da variante `V` (ABR ou legenda soft);
        - `init.mp4` — init segment fMP4 (via `#EXT-X-MAP`);
        - `stream_V.m3u8` — variant playlist da variante `V`;
        - `stream_V_vtt.m3u8` — playlist da rendition de legenda WebVTT;
        - `stream_VN.vtt` — segmento de legenda WebVTT.

        Nome fora desses formatos responde `404` (não `400`) — por isso não há `pattern` aqui.
      example: segment_0.ts

    MediaFileContent:
      type: string
      format: binary
      description: |
        Bytes de um arquivo HLS da sessão (segmento `.ts`/`.m4s`, init segment `.mp4`, playlist
        `.m3u8` ou legenda `.vtt`)

    SessionHeartbeat:
      type: object
      description: Validade da sessão após o heartbeat
      required: [expiresInSeconds]
      properties:
        expiresInSeconds:
          type: integer
          format: int64
          minimum: 0
          description: |
            Segundos restantes até a sessão expirar caso nenhum novo heartbeat chegue. O cliente
            deve pingar novamente antes disso.

    # ---------- anilist ----------
    AnilistFormat:
      type: string
      description: |
        Formato/tipo do anime na AniList (campo `Media.format`). `UNKNOWN` cobre valores que a
        AniList venha a adicionar.
      enum:
        - TV
        - TV_SHORT
        - MOVIE
        - SPECIAL
        - OVA
        - ONA
        - MUSIC
        - UNKNOWN

    AnilistSeason:
      type: string
      description: Estação de estreia do anime (campo `Media.season`)
      enum:
        - WINTER
        - SPRING
        - SUMMER
        - FALL
        - UNKNOWN

    AnilistTitle:
      type: object
      description: |
        Bloco de títulos da AniList — 4 variantes coexistem. Campo `native` da AniList é
        renomeado para `nativeTitle` no JSON porque colide com palavra reservada.
      properties:
        romaji:
          type: string
          nullable: true
          description: Romanização; convenção AniList quando não há preferência
        english:
          type: string
          nullable: true
        nativeTitle:
          type: string
          nullable: true
          description: Título em japonês (kanji/kana)
        userPreferred:
          type: string
          nullable: true
          description: Título preferido do usuário logado; sem token, coincide com `romaji`

    AnilistCoverImage:
      type: object
      description: URLs de poster em 3 resoluções (cada campo pode ser `null`)
      properties:
        medium:
          type: string
          nullable: true
          description: URL da imagem em tamanho pequeno (~100×145)
        large:
          type: string
          nullable: true
          description: URL da imagem em tamanho médio (~230×340)
        extraLarge:
          type: string
          nullable: true
          description: URL da imagem em tamanho grande (~460×645)

    AnilistFuzzyDate:
      type: object
      description: Data parcial — qualquer componente pode ser `null` quando desconhecido
      properties:
        year:
          type: integer
          format: int32
          nullable: true
        month:
          type: integer
          format: int32
          nullable: true
        day:
          type: integer
          format: int32
          nullable: true

    AnilistMediaSummary:
      type: object
      description: |
        Shape reduzido de `Media` para o endpoint de search — omite `relations` para evitar
        payload grande (as relações de cada item). A chave pública é o `anilistId`, a mesma usada
        pelo `animemetadata`.
      required: [anilistId]
      properties:
        anilistId:
          $ref: '#/components/schemas/AnilistId'
        malId:
          type: integer
          format: int32
          nullable: true
          description: Id correspondente do anime no MyAnimeList, quando a AniList souber o match
        title:
          allOf: [{ $ref: '#/components/schemas/AnilistTitle' }]
          nullable: true
        synonyms:
          type: array
          description: Lista de sinônimos
          items:
            type: string
        coverImage:
          allOf: [{ $ref: '#/components/schemas/AnilistCoverImage' }]
          nullable: true
        description:
          type: string
          nullable: true
          description: Sinopse em HTML (mesma convenção do site AniList)
        episodes:
          type: integer
          format: int32
          nullable: true
          description: Total de episódios; `null` para animes em exibição sem previsão
        duration:
          type: integer
          format: int32
          nullable: true
          description: Duração média por episódio em minutos
        startDate:
          allOf: [{ $ref: '#/components/schemas/AnilistFuzzyDate' }]
          nullable: true
        seasonYear:
          type: integer
          format: int32
          nullable: true
          description: Ano da estação de estreia; mais confiável que `startDate.year`
        format:
          allOf: [{ $ref: '#/components/schemas/AnilistFormat' }]
          nullable: true
        season:
          allOf: [{ $ref: '#/components/schemas/AnilistSeason' }]
          nullable: true
        averageScore:
          type: integer
          format: int32
          nullable: true
          description: Nota média em escala 0–100
        isAdult:
          type: boolean
          nullable: true
          description: Flag NSFW derivada do `isAdult` da AniList
        genres:
          type: array
          description: Nomes de gêneros
          items:
            type: string

    AnilistMediaSummaryPage:
      description: Envelope paginado dos resultados de busca
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AnilistMediaSummary'

    # ---------- tmdb ----------
    Language:
      type: string
      description: Tag de idioma BCP 47 (idioma ISO 639-1 + região ISO 3166-1)

    GenreId:
      type: integer
      format: int32
      description: Id de gênero no TMDB (não expandido)

    Popularity:
      type: number
      format: double
      description: Métrica de popularidade

    VoteAverage:
      type: number
      format: double
      description: Nota média (0–10)

    VoteCount:
      type: integer
      format: int32
      description: Total de votos

    LanguageCode:
      type: string
      description: Código de idioma ISO 639-1

    ImageUrl:
      type: string
      description: >-
        URL absoluta da imagem no CDN do TMDB, já montada pelo módulo (base + tamanho). Pronta para
        uso direto — o consumidor não completa nada.

    TmdbMovieSearchResult:
      type: object
      description: Item de resultado de `GET /3/search/movie` — sempre um filme
      required: [tmdbId]
      properties:
        tmdbId:
          $ref: '#/components/schemas/TmdbId'
        adult:
          type: boolean
          nullable: true
          description: Flag de conteúdo adulto
        popularity:
          allOf: [{ $ref: '#/components/schemas/Popularity' }]
          nullable: true
        overview:
          type: string
          nullable: true
          description: Sinopse
        posterUrl:
          allOf: [{ $ref: '#/components/schemas/ImageUrl' }]
          nullable: true
          description: URL absoluta do poster (tamanho `w185`)
        backdropUrl:
          allOf: [{ $ref: '#/components/schemas/ImageUrl' }]
          nullable: true
          description: URL absoluta do backdrop (tamanho `original`)
        voteAverage:
          allOf: [{ $ref: '#/components/schemas/VoteAverage' }]
          nullable: true
        voteCount:
          allOf: [{ $ref: '#/components/schemas/VoteCount' }]
          nullable: true
        originalLanguage:
          allOf: [{ $ref: '#/components/schemas/LanguageCode' }]
          nullable: true
        genreIds:
          type: array
          description: Ids de gêneros (não expandidos)

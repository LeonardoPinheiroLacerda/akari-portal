            $ref: '#/components/schemas/GenreId'
        title:
          type: string
          nullable: true
        originalTitle:
          type: string
          nullable: true
          description: Título no idioma original
        releaseDate:
          type: string
          nullable: true
          description: Data de lançamento em ISO-8601
        video:
          type: boolean
          nullable: true
          description: Flag indicando vídeo direto

    TmdbTvSearchResult:
      type: object
      description: Item de resultado de `GET /3/search/tv` — sempre uma série
      required: [tmdbId]
      properties:
        tmdbId:
          $ref: '#/components/schemas/TmdbId'
        adult:
          type: boolean
          nullable: true
          description: Flag de conteúdo adulto
        popularity:
          allOf: [{ $ref: '#/components/schemas/Popularity' }]
          nullable: true
        overview:
          type: string
          nullable: true
          description: Sinopse
        posterUrl:
          allOf: [{ $ref: '#/components/schemas/ImageUrl' }]
          nullable: true
          description: URL absoluta do poster (tamanho `w185`)
        backdropUrl:
          allOf: [{ $ref: '#/components/schemas/ImageUrl' }]
          nullable: true
          description: URL absoluta do backdrop (tamanho `original`)
        voteAverage:
          allOf: [{ $ref: '#/components/schemas/VoteAverage' }]
          nullable: true
        voteCount:
          allOf: [{ $ref: '#/components/schemas/VoteCount' }]
          nullable: true
        originalLanguage:
          allOf: [{ $ref: '#/components/schemas/LanguageCode' }]
          nullable: true
        genreIds:
          type: array
          description: Ids de gêneros (não expandidos)
          items:
            $ref: '#/components/schemas/GenreId'
        name:
          type: string
          nullable: true
          description: Nome da série
        originalName:
          type: string
          nullable: true
          description: Nome no idioma original
        firstAirDate:
          type: string
          nullable: true
          description: Data de estreia em ISO-8601
        originCountry:
          type: array
          description: Países de origem
          items:
            type: string

    TmdbMovieSearchResultPage:
      description: Envelope paginado de resultados de filmes
      allOf:
        - $ref: '#/components/schemas/Page'

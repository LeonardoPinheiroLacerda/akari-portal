openapi: 3.0.3

info:
  title: Akari API
  version: 1.0.0
  description: |
    API do akari: catálogo de vídeos ingeridos de storage providers, metadata de anime (AniList +
    TMDB), cache local e reprodução via HLS. Cada tag descreve uma área da API.

    Convenções comuns a todos os endpoints:

    - **Paginação** 0-based, com `size` padrão `12` e envelope `data` + `page`/`size`/
      `totalElements`/`totalPages` (schema `Page`).
    - **Erros** sempre com o corpo `ApiError`; o cliente chaveia o tratamento pelo `code`
      (`ApiErrorCode`), nunca pelo texto de `message`.
    - **Ids** inteiros (`int32`), exceto a sessão de playback (UUID). Um id de path que não é
      numérico responde `404`.
    - **Integrações**: chamadas à AniList e ao TMDB são cache-first; `forceRefresh=true` força a
      busca upstream. Preferência obrigatória sem valor responde `503`.

servers:
  - url: /
    description: Host onde o backend akari estiver rodando

tags:
  - name: StorageProvider
    description: |
      Storage providers cadastrados (MEGA etc.).

      Cadastra e gerencia os provedores de armazenamento de onde vêm os vídeos. Tipos suportados:

      - `MEGA` — remoto, acessado via rclone. Os arquivos são baixados para o cache local antes
        do playback.
      - `LOCAL` — diretório no disco do servidor, lido direto do caminho real, sem rclone e sem
        cache.

      Cada provider tem uma configuração tipada. Campos sensíveis (senhas) são obscurecidos via
      rclone (`/core/obscure`) antes de persistir; `LOCAL` não tem campos sensíveis.

      O payload de leitura **não** expõe o campo `config` — evita vazar credenciais mesmo
      obscurecidas para clientes da API.
  - name: Ingestion
    description: |
      Reconciliação subtree ↔ catalog por storage provider.

      Reconcilia o subtree de um storage provider com o catalog e permite consultar/desingerir
      subtrees. Não persiste estado próprio — só orquestra chamadas ao provider (via port) e ao
      catalog (via port).

      Ingestão é uma reconciliação do subtree com o catalog: pastas/arquivos já registrados são
      preservados, novos são criados e os que não existem mais no provider são removidos do
      catalog. O `rootPath` limita o subtree a processar; ausente ou vazio opera sobre a raiz
      inteira do provider.
  - name: MediaFolder
    description: |
      Pastas ingeridas do storage provider.

      Expõe pastas (`MediaFolder`) e arquivos de vídeo (`VideoFile`) ingeridos a partir dos
      storage providers. O catalog é agnóstico a metadata — enriquecimento (episódio, temporada,
      thumbnail, etc.) fica nos módulos de metadata donos do binding `folderId → payload`.
  - name: VideoFile
    description: Arquivos de vídeo dentro de uma pasta
  - name: Cache
    description: |
      Fila, listagem, cancelamento e remoção do cache local de vídeo.

      Gerencia o cache local de arquivos de vídeo: enfileira downloads de arquivos remotos
      (resolvidos via storage provider) para o disco local, numa fila serial de 1 slot com
      eviction LRU por espaço. Uma linha `QUEUED` ou `DOWNLOADING` pode ser cancelada antes
      de concluir, e uma linha `COMPLETED` pode ter o arquivo apagado manualmente antes da
      eviction LRU.

      O acompanhamento de progresso em tempo real é feito por um stream SSE em
      `/v1/cache/events` — **não modelado neste contrato** (o gerador `jaxrs-spec` não
      descreve Server-Sent Events); é servido por um resource code-first.
  - name: MediaProbe
    description: |
      Probe de metadados de mídia via ffprobe.

      Extrai os metadados técnicos (container e streams) de um arquivo de vídeo disponível em
      disco, executando `ffprobe` sob demanda: arquivos de provider `LOCAL` são lidos direto do
      caminho real; os de provider remoto, do cache local depois de baixados. Stateless — nada é
      persistido; cada chamada roda o probe.
  - name: Playback
    description: |
      Sessões de reprodução de mídia (transcode HLS sob demanda).

      Orquestra a reprodução de um arquivo de vídeo disponível em disco (provider `LOCAL`, lido
      direto; ou provider remoto, já baixado no cache): inicia uma sessão de transcode sob demanda
      para HLS, permite reposicionar (seek), serve a playlist `m3u8` gerada e recebe heartbeats do
      cliente para saber se a sessão ainda está em uso.

      O recurso central é a **sessão de playback**, identificada por um `sessionId` (UUID) gerado
      ao iniciar o transcode. Os demais endpoints operam sobre essa sessão.
  - name: AnilistSearch
    description: |
      Busca paginada de anime na AniList.

      Expõe busca paginada de anime diretamente na AniList (query GraphQL `Page(page,
      perPage).media(search, type: ANIME)`). Fluxo cache-first com cache interno em PostgreSQL
      (`IntegrationCache`); chamadas upstream só quando o cache é frio ou `forceRefresh=true`.

      Shape devolvido é o subset de `Media` sem `relations` — mantém o payload do search enxuto.
      Consumidores que precisam da ficha completa (com relations) chamam o módulo
      `animemetadata` passando o `anilistId` retornado aqui.

      Paginação **0-based**, como no resto do akari — o módulo converte para a paginação
      1-based da AniList.
  - name: TmdbSearch
    description: |
      Busca paginada de filmes e séries no TMDB.

      Expõe busca paginada no TMDB v3 — um endpoint por tipo de conteúdo (filme e série). Fluxo
      cache-first com cache interno em PostgreSQL (`IntegrationCache`); chamadas upstream só
      quando o cache é frio ou `forceRefresh=true`.

      Cada item carrega os campos do resultado TMDB correspondente (`/3/search/movie` e
      `/3/search/tv`), normalizados pelo módulo:

      - nomes em camelCase (`original_title` → `originalTitle`) e `id` → `tmdbId`;
      - `poster_path`/`backdrop_path` relativos viram URLs absolutas do CDN
        (`posterUrl` em `w185`, `backdropUrl` em `original`);
      - a paginação segue o padrão do akari — **0-based** — mas sem `size`: o TMDB pagina em
        blocos fixos de 20, sem suporte a tamanho configurável, e a conversão real é só
        `page + 1` (0-based → 1-based) repassado direto ao TMDB, sem busca de múltiplas páginas
        upstream.

      Consumidores que precisam da ficha completa (com temporadas, imagens, traduções) usam o
      `animemetadata`.
  - name: Anime
    description: |
      Metadata de anime (binding anime↔pasta, sync, curadoria).

      Gerencia a metadata de anime (binding com pastas do catalog, sync AniList) e a camada de
      enriquecimento TMDB (binding, overrides, file pairing). Dois eixos principais:

      - **Anime** (base): binding anime↔pasta, fetch/sync AniList, curadoria manual (franchise
        root), grafo de relações entre animes.
      - **TMDB** (enriquecimento): binding TMDB↔anime, overrides manuais (título, sinopse,
        poster/backdrop/logo), file pairing (temporada/episódio/thumbnail por vídeo).

      O binding TMDB é opcional — anime funciona sem ele; só os campos `banner`/`logo` do
      `AnimeResponse` ficam `null` sem TMDB + overrides.
  - name: AnimeRelations
    description: Relações (sequel/prequel/side story) entre animes
  - name: AnimeTmdb
    description: Binding TMDB e overrides do anime
  - name: AnimeTmdbFilePairing
    description: Pairing TMDB por arquivo de vídeo (temporada, episódio, thumbnail)
  - name: Setting
    description: |
      Preferências do admin.

      Expõe as preferências do admin (par `key`/`value`) para o portal listar, pesquisar por nome
      e atualizar. Preferências marcadas como `secret` (ex.: `tmdb.api-key`) nunca têm o `value`
      ecoado nas respostas — só o flag `configured` indica se há valor cadastrado.
  - name: Notification
    description: |
      Notificações de observabilidade.

      Lista paginada de notificações de observabilidade, conta as não-lidas (badge) e marca como
      lidas (individual/todas). Hoje, todas as notificações são emitidas pelo domínio `ingestion`
      (falhas de integração com storage provider/AniList/TMDB e problemas de qualidade do
      auto-bind/pairing); nenhum outro domínio emite notificação ainda.

      O push em tempo real é um stream SSE em `/v1/notifications/events`, no mesmo molde do
      `/v1/cache/events`: **não é modelado neste contrato** (o gerador `jaxrs-spec` não descreve
      Server-Sent Events) e é servido por um resource code-first. Emite um evento sempre que uma
      notificação nova é criada.

paths:

  # ---------- storageprovider ----------
  /v1/storage/providers:
    get:
      tags: [StorageProvider]
      operationId: listStorageProviders
      summary: Lista paginada de providers cadastrados
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          $ref: '#/components/responses/StorageProviderPageOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [StorageProvider]
      operationId: createStorageProvider
      summary: Cadastra um novo provider
      description: |
        `config` é um mapa livre de chave-valor cujo schema **depende de `type`** (ex.:
        `MEGA` exige `email` e `password`). A validação do schema tipado acontece dentro do
        service; campos anotados `@Obscure` no record de config passam pelo rclone antes de
        persistir.
      requestBody:
        $ref: '#/components/requestBodies/CreateStorageProviderRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/StorageProviderCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/storage/providers/{providerId}:
    parameters:
      - $ref: '#/components/parameters/StorageProviderIdPathParam'
    get:
      tags: [StorageProvider]
      operationId: getStorageProviderById
      summary: Busca um provider por id (sem expor `config`)
      responses:
        '200':
          $ref: '#/components/responses/StorageProviderOk'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [StorageProvider]
      operationId: deleteStorageProvider
      summary: Remove o provider
      responses:
        '204':
          $ref: '#/components/responses/StorageProviderDeleted'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/storage/providers/{providerId}/config:
    parameters:
      - $ref: '#/components/parameters/StorageProviderIdPathParam'
    put:
      tags: [StorageProvider]
      operationId: updateStorageProviderConfig
      summary: Substitui a configuração do provider
      description: |
        `type` é imutável — só a `config` pode ser trocada. O schema esperado do map
        depende do `type` já persistido; campos `@Obscure` reobscurecidos antes de gravar.
      requestBody:
        $ref: '#/components/requestBodies/UpdateStorageProviderConfigRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/StorageProviderOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/storage/providers/{providerId}/health:
    parameters:
      - $ref: '#/components/parameters/StorageProviderIdPathParam'
    get:
      tags: [StorageProvider]
      operationId: checkStorageProviderHealth
      summary: Testa conectividade real com o provider
      description: |
        Sempre `200` quando o teste roda — o resultado vem em `healthy`. `healthy: false`
        cobre qualquer falha do lado do provider (config inválida, credenciais erradas, remoto
        fora do ar; para `LOCAL`, `rootPath` que não é um diretório). `502` fica reservado para
        falha do próprio rclone (rcd fora do ar), não do provider.
      responses:
        '200':
          $ref: '#/components/responses/StorageProviderHealthOk'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------- ingestion ----------
  /v1/ingestion/providers/{providerId}:
    parameters:
      - $ref: '#/components/parameters/StorageProviderIdPathParam'
    post:
      tags: [Ingestion]
      operationId: ingestProviderSubtree
      summary: Ingere um subtree do provider no catalog
      description: |
        Dispara a reconciliação do subtree indicado por `rootPath` (ou a raiz, se omitido)
        com o catalog **em background** e retorna `202` imediatamente, sem aguardar o resultado.

        Só são síncronos a validação do payload (`400`), o precheck de que o TMDB está
        configurado — `400` se a preferência `tmdb.api-key` estiver vazia, já que sem TMDB
        nenhum anime completaria o binding automático — e o precheck de existência do
        provider (`404`). Todo o resto roda depois da resposta — inclusive a verificação de
        que o `rootPath` existe no provider. O resultado é reportado pelo módulo
        `notification`: uma notificação `INFO` ao concluir, ou `ERROR` se a ingestão falhar.

        Etapas, em ordem:

        1. Lista a árvore do subtree no provider.
        2. Remove do catalog as pastas/arquivos do subtree que não existem mais no provider.
        3. Cria as pastas novas (pai antes do filho) com o `mediaType` recebido — pastas já
           registradas mantêm o `mediaType` que tinham — e os arquivos de vídeo novos.
        4. Cada pasta com vídeos diretos é vinculada automaticamente, antes de a próxima ser
           processada: busca na AniList → binding AniList → binding TMDB → pairing de episódios
           (este só quando o TMDB mapeado é série). Uma falha numa dessas etapas vira notificação
           `WARNING`/`ERROR` sem interromper a ingestão. O binding automático roda
           independentemente do `mediaType`.

        Um disparo para o mesmo `(providerId, rootPath)` enquanto outro está em andamento é
        ignorado — a resposta é a mesma `202`, sem iniciar uma segunda ingestão.
      requestBody:
        $ref: '#/components/requestBodies/IngestSubtreeRequestBody'
      responses:
        '202':
          $ref: '#/components/responses/IngestionStarted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Ingestion]
      operationId: removeIngestedSubtree
      summary: Remove um subtree ingerido do catalog
      description: |
        Remove do catalog as pastas/arquivos correspondentes ao subtree indicado por
        `rootPath` (ou tudo do provider, se omitido), junto com os bindings de metadata
        (`animemetadata`) dessas pastas. **Não** toca no provider upstream. Operação
        idempotente — devolve `204` mesmo quando nada casa, inclusive se o `providerId` não
        existir (não há precheck).
      parameters:
        - $ref: '#/components/parameters/RootPathParam'
      responses:
        '204':
          $ref: '#/components/responses/IngestionRemoved'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/ingestion/providers/{providerId}/available-folders:
    parameters:
      - $ref: '#/components/parameters/StorageProviderIdPathParam'
    get:
      tags: [Ingestion]
      operationId: listAvailableFolders
      summary: Árvore de pastas do provider com status de ingestão
      description: |
        Devolve a árvore de diretórios do provider marcada com o status de ingestão de
        cada nó (`ingested: true|false`). Consumido pelo frontend antes da ingestão para
        o usuário escolher o que ingerir.

        Responde `400` se o `rootPath` não existe no provider, `404` se o provider não existe e `502` se o rclone/provider falhar (rcd fora do ar, credenciais inválidas, timeout).
      parameters:
        - $ref: '#/components/parameters/RootPathParam'
      responses:
        '200':
          $ref: '#/components/responses/AvailableFolderNodeOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------- catalog ----------
  /v1/catalog/folders:
    get:
      tags: [MediaFolder]
      operationId: listFolders
      summary: Lista paginada de pastas com filtros AND
      description: |
        Filtros são AND — cada query param não-nulo restringe o resultado. `sort` aceita
        specs `field[:asc|desc]` na whitelist `name`, `createdAt`. Cada pasta já vem com
        `animeBinding` preenchido quando vinculada — não é preciso uma segunda chamada pra
        buscar os bindings da página.

        `reviewStatus`, `hasAnilist`, `hasTmdb` e `allEpisodesPaired` filtram pelo anime
        vinculado à pasta (quando houver); pastas sem nenhum anime vinculado só batem com
        `hasAnilist=false` — qualquer um dos outros três junto de uma pasta sem binding
        não traz resultado.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/NameFilterParam'
        - $ref: '#/components/parameters/MediaTypeFilterParam'
        - $ref: '#/components/parameters/StorageProviderIdFilterParam'
        - $ref: '#/components/parameters/ParentIdFilterParam'
        - $ref: '#/components/parameters/HasFilesFilterParam'
        - $ref: '#/components/parameters/ReviewStatusFilterParam'
        - $ref: '#/components/parameters/HasAnilistFilterParam'
        - $ref: '#/components/parameters/HasTmdbFilterParam'
        - $ref: '#/components/parameters/AllEpisodesPairedFilterParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          $ref: '#/components/responses/MediaFolderPageOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [MediaFolder]
      operationId: createFolder
      summary: Cria uma nova pasta
      description: |
        A pasta pai é derivada do `path`: é a pasta do mesmo provider cujo path é o `path` sem o
        último segmento. Se ela não estiver registrada, a nova pasta vira raiz (`parentId`
        `null`) — não é erro.

        Responde `404` se o `storageProviderId` informado não existe.
      requestBody:
        $ref: '#/components/requestBodies/MediaFolderRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/MediaFolderCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/catalog/folders/{folderId}:
    parameters:
      - $ref: '#/components/parameters/FolderIdPathParam'
    get:
      tags: [MediaFolder]
      operationId: getFolder
      summary: Busca uma pasta por id
      responses:
        '200':
          $ref: '#/components/responses/MediaFolderOk'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [MediaFolder]
      operationId: updateFolder
      summary: Substitui os campos mutáveis da pasta
      description: |
        Payload substituto (não patch). A pasta pai é redescoberta a partir do novo `path`
        (raiz se não houver pai registrado); `createdAt` é preservado.
      requestBody:
        $ref: '#/components/requestBodies/MediaFolderRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/MediaFolderOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [MediaFolder]
      operationId: deleteFolder
      summary: Remove a pasta
      description: Descendentes e arquivos abrigados descem pela cascata do DDL.
      responses:
        '204':
          $ref: '#/components/responses/MediaFolderDeleted'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/catalog/video-files:
    get:
      tags: [VideoFile]
      operationId: listVideoFiles
      summary: Lista paginada dos arquivos de uma pasta específica
      description: |
        Não há listagem de várias pastas ao mesmo tempo — o cliente sempre olha os arquivos de
        uma pasta por vez. Se a pasta não existir ou não tiver arquivos, devolve página vazia
        (não 404). Cada arquivo já vem com `tmdbPairing` preenchido quando pareado — não é
        preciso uma segunda chamada pra buscar os pairings da página.
      parameters:
        - $ref: '#/components/parameters/FolderIdRequiredParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          $ref: '#/components/responses/VideoFilePageOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [VideoFile]
      operationId: createVideoFile
      summary: Cria um novo arquivo
      description: |
        O `path` é derivado server-side a partir da pasta pai + `name`.

        Responde `404` se o `folderId` informado não existe.
      requestBody:
        $ref: '#/components/requestBodies/VideoFileRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/VideoFileCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/catalog/video-files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/FileIdPathParam'
    get:
      tags: [VideoFile]
      operationId: getVideoFile
      summary: Busca um arquivo por id
      responses:
        '200':
          $ref: '#/components/responses/VideoFileOk'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [VideoFile]
      operationId: updateVideoFile
      summary: Substitui os campos mutáveis do arquivo
      description: |
        Se `folderId` mudar, o `path` é rederivado.

        Responde `404` se o `fileId` ou o `folderId` informado não existe.
      requestBody:
        $ref: '#/components/requestBodies/VideoFileRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/VideoFileOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [VideoFile]
      operationId: deleteVideoFile
      summary: Remove o arquivo
      description: Sem cascata — arquivo é folha.
      responses:
        '204':
          $ref: '#/components/responses/VideoFileDeleted'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------- cache ----------
  /v1/cache/items:
    post:
      tags: [Cache]
      operationId: queueCacheDownload
      summary: Enfileira o download de um arquivo de vídeo
      description: |
        Enfileira o arquivo criando uma linha `QUEUED`. O download acontece depois, dirigido pelo
        scheduler interno.

        Responde `400` (`BUSINESS_RULE_VIOLATION`) quando:
        - o arquivo já tem linha `QUEUED`, `DOWNLOADING` ou `COMPLETED` — uma linha `FAILED`
          pode ser reenfileirada;
        - o arquivo pertence a um provider `LOCAL`, que é lido direto do disco e não usa cache.

        Responde `404` se o `fileId` não existe no catalog.
      requestBody:
        $ref: '#/components/requestBodies/CacheQueueRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/CacheItemCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Cache]
      operationId: listCaches
      summary: Lista todas as linhas do cache
      description: |
        Página de todas as linhas, ordenadas por ordem de enfileiramento. `pendingOnly=true`
        restringe às linhas com status diferente de `COMPLETED` (inclui `FAILED`, já que pode
        ser reenfileirada).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/PendingOnlyFilterParam'
      responses:
        '200':
          $ref: '#/components/responses/CacheItemPageOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/cache/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/CacheItemIdPathParam'
    delete:
      tags: [Cache]
      operationId: deleteCacheItem
      summary: Remove uma linha do cache, cancelando ou apagando o arquivo conforme o status
      description: |
        Remove a linha do cache. O efeito depende do status:
        - `QUEUED`/`DOWNLOADING`: cancela — se `DOWNLOADING`, interrompe o job rclone em
          andamento antes de remover.
        - `COMPLETED`: apaga o arquivo já baixado de `cache.dir` antes de remover a linha.

        Responde `400` (`BUSINESS_RULE_VIOLATION`) se a linha estiver `FAILED` — o único caminho
        para ela é reenfileirar (`POST /v1/cache/items`). Uma linha `FAILED` não é removida pela
        eviction LRU, que só considera linhas `COMPLETED`: ela permanece até ser reenfileirada.

        Responde `404` se o `itemId` não existir.
      responses:
        '204':
          $ref: '#/components/responses/CacheItemDeleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------- mediaprobe ----------
  /v1/mediaprobe/files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/FileIdPathParam'
    get:
      tags: [MediaProbe]
      operationId: getMediaProbe
      summary: Extrai o probe de um vídeo disponível em disco
      description: |
        Resolve o arquivo em disco (direto, para provider `LOCAL`; pelo cache, para provider
        remoto) e roda `ffprobe -show_format -show_streams`. Responde `404` se o arquivo de
        provider remoto ainda não terminou de baixar no cache, e `502` se o ffprobe falhar sobre
        um arquivo existente.
      responses:
        '200':
          $ref: '#/components/responses/MediaProbeOk'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------- playback ----------
  /v1/playback/sessions:
    post:
      tags: [Playback]
      operationId: startPlaybackSession
      summary: Inicia uma sessão de transcode
      description: |
        Inicia o transcode da mídia (referenciada por `fileId`) com o perfil, faixa
        de áudio e, opcionalmente, faixa de legenda escolhidos. Gera e devolve o `sessionId`
        (UUID) que identifica a sessão, junto do endereço da playlist `m3u8`.

        Responde `404` se o vídeo é de provider remoto e ainda não terminou de baixar no cache.
      requestBody:
        $ref: '#/components/requestBodies/StartPlaybackSessionRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/SessionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/playback/sessions/{sessionId}/seek:
    parameters:
      - $ref: '#/components/parameters/SessionIdPathParam'
    post:
      tags: [Playback]
      operationId: seekPlaybackSession
      summary: Reposiciona o transcode de uma sessão
      description: |
        Reposiciona o transcode de uma sessão já iniciada para o instante informado. A playlist
        `m3u8` passa a refletir a nova posição. Responde `404` se a sessão não existe ou já
        expirou.
      requestBody:
        $ref: '#/components/requestBodies/SeekRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/SessionOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/playback/sessions/{sessionId}/tracks:
    parameters:
      - $ref: '#/components/parameters/SessionIdPathParam'
    post:
      tags: [Playback]
      operationId: switchPlaybackSessionTracks
      summary: Troca as faixas de áudio/legenda de uma sessão
      description: |
        Troca a faixa de áudio e, opcionalmente, a de legenda de uma sessão já iniciada,
        reiniciando o transcode a partir do instante informado. Ao contrário do `seek`, esta
        operação sempre reinicia o processo de transcode — não há posição que evite o
        reinício, já que trocar `-map`/filtro de legenda exige um novo processo `ffmpeg`.
        Responde `404` se a sessão não existe ou já expirou.
      requestBody:
        $ref: '#/components/requestBodies/SwitchTracksRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/SessionOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/playback/sessions/{sessionId}/playlist.m3u8:
    parameters:
      - $ref: '#/components/parameters/SessionIdPathParam'
    get:
      tags: [Playback]
      operationId: getPlaybackPlaylist
      summary: Serve a playlist HLS da sessão
      description: |
        Devolve a playlist `m3u8` gerada pelo transcode da sessão, no content-type HLS. Quando o
        transcode produz um master playlist (ABR com várias resoluções, ou legenda soft), é ele que
        é devolvido — e ele referencia os variant playlists `stream_N.m3u8`. Caso contrário,
        devolve a media playlist da rendition única. Responde `404` se a sessão não existe,
        expirou ou ainda não produziu playlist.

        O header `X-Playback-Heartbeat-Ttl-Seconds` informa, em segundos, o TTL do heartbeat que o
        cliente deve respeitar — é o mesmo prazo devolvido no corpo do endpoint de heartbeat. O
        valor é uma preferência do admin.

        Todos os arquivos referenciados pela playlist (variant playlists, segmentos, init segment e
        segmentos de legenda) são servidos pelo endpoint
        `GET /v1/playback/sessions/{sessionId}/{file}`.
      responses:
        '200':
          $ref: '#/components/responses/PlaylistOk'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/playback/sessions/{sessionId}/{file}:
    parameters:
      - $ref: '#/components/parameters/SessionIdPathParam'
      - $ref: '#/components/parameters/MediaFilePathParam'
    get:
      tags: [Playback]
      operationId: getPlaybackMediaFile
      summary: Serve um arquivo HLS referenciado pela playlist da sessão
      description: |
        Devolve um arquivo referenciado pela playlist da sessão (ver `MediaFileName` para os nomes
        aceitos). O content-type é escolhido pela extensão: `.ts` → `video/mp2t`; `.m4s` e
        `init.mp4` → `video/mp4`; `.m3u8` → `application/vnd.apple.mpegurl`; `.vtt` → `text/vtt`.

        Responde `404` se a sessão não existe, expirou, se o nome não corresponde a um arquivo
        aceito, ou se o transcode ainda não o produziu — no caso de segmento ainda não gerado, o
        player deve retentar ao alcançar a borda ao vivo.
      responses:
        '200':
          $ref: '#/components/responses/MediaFileOk'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/playback/sessions/{sessionId}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/SessionIdPathParam'
    post:
      tags: [Playback]
      operationId: heartbeatPlaybackSession
      summary: Mantém a sessão viva
      description: |
        Ping periódico do cliente para sinalizar que a sessão ainda está em uso — renova o TTL da
        sessão e devolve a validade restante. O TTL é uma preferência do admin. O cliente deve
        chamar novamente antes de a validade expirar. Responde `404` se a sessão não existe ou já
        expirou.
      responses:
        '200':
          $ref: '#/components/responses/HeartbeatOk'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'


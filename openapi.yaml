          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TmdbMovieSearchResult'

    TmdbTvSearchResultPage:
      description: Envelope paginado de resultados de séries
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TmdbTvSearchResult'

    # ---------- animemetadata ----------
    GraphDepth:
      type: integer
      format: int32
      default: 3
      description: Profundidade máxima da BFS de relações

    TmdbMediaType:
      type: string
      description: Discriminador do binding TMDB — `TV` (série) ou `MOVIE` (filme).
      enum:
        - TV
        - MOVIE

    AnimeBindingRequest:
      type: object
      description: Payload de binding anime↔pasta
      required: [folderId]
      properties:
        folderId:
          $ref: '#/components/schemas/FolderId'

    FranchiseRootCuration:
      type: string
      description: |
        Curadoria da flag de raiz de franquia. `MANUAL_ROOT` força este anime como raiz, mesmo
        com relação ancestral; `MANUAL_NOT_ROOT` força NÃO ser raiz (desabilita a raiz natural,
        mesmo sem ancestral); `AUTO` deixa automático — é raiz quando não sai dele nenhuma
        relação `PREQUEL` nem `PARENT`.
      enum:
        - AUTO
        - MANUAL_ROOT
        - MANUAL_NOT_ROOT

    AnimeFranchiseRootRequest:
      type: object
      description: Payload da curadoria manual da raiz de franquia
      required: [franchiseRootCuration]
      properties:
        franchiseRootCuration:
          $ref: '#/components/schemas/FranchiseRootCuration'

    AnimeReviewStatus:
      type: string
      description: |
        Estado de revisão da ingestão automática de um anime.
        - `PENDING_REVIEW`: ingestão completa (AniList + TMDB + todos os arquivos pareados),
          aguardando confirmação manual.
        - `PARTIAL`: ingestão incompleta (TMDB não vinculado, temporadas conflitantes, ou nem
          todo arquivo pareado) — precisa de atenção.
        - `REVIEWED`: confirmado manualmente; o auto-bind nunca sobrescreve esse estado.
      enum:
        - PENDING_REVIEW
        - PARTIAL
        - REVIEWED

    AnimeTitlesResponse:
      type: object
      description: Títulos localizados
      properties:
        main:
          type: string
          nullable: true
          description: Título principal
        english:
          type: string
          nullable: true
        japanese:
          type: string
          nullable: true
        synonyms:
          type: array
          nullable: true
          items:
            type: string

    AnimeThumbnailsResponse:
      type: object
      description: URLs de poster em 3 resoluções
      properties:
        small:
          type: string
          nullable: true
        medium:
          type: string
          nullable: true
        large:
          type: string
          nullable: true

    AnimeBindingSummary:
      type: object
      description: |
        Resumo leve do binding de uma pasta — o suficiente para o card do catálogo
        (status vinculado + capa + título). Para a vista completa use o `AnimeResponse`.
      required: [folderId, anilistId]
      properties:
        folderId:
          $ref: '#/components/schemas/FolderId'
        anilistId:
          $ref: '#/components/schemas/AnilistId'
        malId:
          type: integer
          format: int32
          nullable: true
          description: Id correspondente do anime no MyAnimeList, quando a AniList souber o match
        title:
          type: string
          nullable: true
          description: Título principal
        thumbnail:
          type: string
          nullable: true
          description: URL do poster (resolução média)
        year:
          type: integer
          format: int32
          nullable: true
        format:
          type: string
          nullable: true
          description: Formato (`TV`, `MOVIE`, `OVA`, ...)
        hasTmdb:
          type: boolean
          nullable: true
          description: '`true` se o anime também tem binding TMDB'

    AnimeResponse:
      type: object
      description: |
        Vista pública de um anime. `banner`/`logo` só são preenchidos quando há binding TMDB —
        o bind já escolhe a imagem mais votada automaticamente, e um override manual pode
        trocar essa escolha depois. `synopsis` vem em HTML quando a fonte é AniList (pode
        conter `<br>`, `<i>`, `<b>`).
      required: [anilistId, franchiseRootCuration]
      properties:
        anilistId:
          $ref: '#/components/schemas/AnilistId'
        malId:
          type: integer
          format: int32
          nullable: true
          description: Id correspondente do anime no MyAnimeList, quando a AniList souber o match
        titles:
          allOf: [{ $ref: '#/components/schemas/AnimeTitlesResponse' }]
          nullable: true
        synopsis:
          type: string
          nullable: true
          description: Sinopse em HTML
        thumbnails:
          allOf: [{ $ref: '#/components/schemas/AnimeThumbnailsResponse' }]
          nullable: true
        banner:
          type: string
          nullable: true
          description: Backdrop; URL absoluta quando há override manual
        logo:
          type: string
          nullable: true
          description: Logo; URL absoluta quando há override manual
        episodes:
          type: integer
          format: int32
          nullable: true
        duration:
          type: string
          nullable: true
          description: Duração média por episódio (formato livre)
        year:
          type: integer
          format: int32
          nullable: true
        format:
          type: string
          nullable: true
          description: Formato do anime (`TV`, `MOVIE`, `OVA`, ...)
        season:
          type: string
          nullable: true
          description: Estação de estreia (`WINTER`, `SPRING`, ...)
        score:
          type: number
          format: double
          nullable: true
          description: Nota média em escala 0–10
        isAdult:
          type: boolean
          nullable: true
          description: Flag NSFW
        genres:
          type: array
          nullable: true
          items:
            type: string
        franchiseRootCuration:
          $ref: '#/components/schemas/FranchiseRootCuration'
        reviewStatus:
          allOf: [{ $ref: '#/components/schemas/AnimeReviewStatus' }]
          nullable: true
          description: '`null` até o auto-bind terminar de processar a pasta pela primeira vez'

    AnimePage:
      description: Envelope paginado de animes
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AnimeResponse'

    AnimeRelationNode:
      type: object
      description: Vértice do grafo (payload minimalista para o front)
      required: [anilistId, rootKind]
      properties:
        anilistId:
          $ref: '#/components/schemas/AnilistId'
        malId:
          type: integer
          format: int32
          nullable: true
          description: Id correspondente do anime no MyAnimeList, quando a AniList souber o match
        title:
          type: string
          nullable: true
          description: Título principal
        posterUrl:
          type: string
          nullable: true
          description: URL do poster (thumbnail)
        folderId:
          allOf: [{ $ref: '#/components/schemas/FolderId' }]
          nullable: true
        rootKind:
          allOf: [{ $ref: '#/components/schemas/AnimeRootKind' }]
          description: >-
            Classificação de raiz já decidida no backend a partir da curadoria + estrutura do grafo.
            A curadoria crua (`franchiseRootCuration`) vive no detalhe do anime, não no nó do grafo.

    AnimeRootKind:
      type: string
      description: >-
        Tipo de raiz de franquia resolvido no backend. `MANUAL` = curadoria explícita
        (`franchiseRootCuration = MANUAL_ROOT`); `NATURAL` = curadoria automática
        (`franchiseRootCuration = AUTO`) e nenhuma relação ancestral (`PREQUEL` ou `PARENT`) sai
        do anime; `NOT_ROOT` = não é raiz (curadoria `MANUAL_NOT_ROOT`, ou `AUTO` com relação
        ancestral).
      enum:
        - MANUAL
        - NATURAL
        - NOT_ROOT

    AnimeRelationEdge:
      type: object
      description: Aresta do grafo
      required: [from, to]
      properties:
        from:
          allOf: [{ $ref: '#/components/schemas/AnilistId' }]
          description: '`anilistId` de origem'
        to:
          allOf: [{ $ref: '#/components/schemas/AnilistId' }]
          description: '`anilistId` de destino'
        relationType:
          type: string
          nullable: true
          description: 'Nome do enum (ex.: `SEQUEL`, `PREQUEL`)'

    AnimeRelationGraphResponse:
      type: object
      description: Grafo materializado a partir de um anime raiz
      required: [rootAnilistId]
      properties:
        rootAnilistId:
          allOf: [{ $ref: '#/components/schemas/AnilistId' }]
          description: '`anilistId` que ancorou a busca'
        nodes:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/AnimeRelationNode'
        edges:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/AnimeRelationEdge'

    TmdbBindingRequest:
      type: object
      description: Payload de binding TMDB
      required: [tmdbId, mediaType]
      properties:
        tmdbId:
          $ref: '#/components/schemas/TmdbId'
        mediaType:
          $ref: '#/components/schemas/TmdbMediaType'

    TmdbOverrides:
      type: object
      description: |
        Overrides TMDB — todos os campos opcionais; `null` significa "não sobrepõe".
        Também usado como body de PUT (body com todos `null` apaga a linha); os campos
        `*PreviewUrl` são só de leitura, ignorados num PUT.
      properties:
        title:
          type: string
          nullable: true
        synopsis:
          type: string
          nullable: true
        posterPath:
          type: string
          nullable: true
          description: Caminho relativo do poster (`filePath` cru do TMDB)
        posterPreviewUrl:
          type: string
          nullable: true
          description: URL completa do CDN do TMDB, já pronta pra exibir (derivada de `posterPath`)
        backdropPath:
          type: string
          nullable: true
        backdropPreviewUrl:
          type: string
          nullable: true
          description: URL completa do CDN do TMDB, já pronta pra exibir (derivada de `backdropPath`)
        logoPath:
          type: string
          nullable: true
        logoPreviewUrl:
          type: string
          nullable: true
          description: URL completa do CDN do TMDB, já pronta pra exibir (derivada de `logoPath`)

    TmdbAnimeStateResponse:
      type: object
      description: Estado TMDB do anime (binding + overrides)
      properties:
        tmdbId:
          allOf: [{ $ref: '#/components/schemas/TmdbId' }]
          nullable: true
        mediaType:
          allOf: [{ $ref: '#/components/schemas/TmdbMediaType' }]
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        overrides:
          allOf: [{ $ref: '#/components/schemas/TmdbOverrides' }]
          nullable: true

    TmdbLocalizedOption:
      type: object
      description: |
        Opção textual do schema de overrides. `value` é o que o front grava como override;
        `language` é apenas para exibição (badge de idioma).
      properties:
        value:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
          description: ISO 639-1; `null` quando o TMDB não informa

    TmdbImageOption:
      type: object
      description: |
        Opção de imagem do schema de overrides. `value` é o `filePath` cru; `previewUrl`
        é a URL completa pronta para renderizar.
      properties:
        value:
          type: string
          nullable: true
          description: '`filePath` relativo (grava em overrides)'
        previewUrl:
          type: string
          nullable: true
          description: URL completa para preview
        language:
          type: string
          nullable: true
          description: ISO 639-1; `null` para variantes neutras
        width:
          type: integer
          format: int32
          nullable: true
        height:
          type: integer
          format: int32
          nullable: true

    TmdbOverridesSchema:
      type: object
      description: Opções concretas por campo que aceita override (traduções e imagens)
      properties:
        title:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TmdbLocalizedOption'
        synopsis:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TmdbLocalizedOption'
        posterPath:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TmdbImageOption'
        backdropPath:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TmdbImageOption'
        logoPath:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TmdbImageOption'

    TmdbFilePairingSchemaEpisode:
      type: object
      description: Episódio numa temporada do schema de pairing
      properties:
        episodeNumber:
          type: integer
          format: int32
          nullable: true
        name:
          type: string
          nullable: true
        overview:
          type: string
          nullable: true
          description: Sinopse curta do episódio
        airDate:
          type: string
          nullable: true
          description: Data de estreia ISO-8601 (`null` para episódios futuros)
        runtime:
          type: integer
          format: int32
          nullable: true
          description: Duração em minutos
        voteAverage:
          type: number
          format: double
          nullable: true
          description: Nota média do TMDB
        voteCount:
          type: integer
          format: int32
          nullable: true
          description: Total de votos que compõem a nota média
        episodeType:
          type: string
          nullable: true
          description: 'Classificação do TMDB (ex.: `standard`, `finale`)'
        defaultStillPath:
          type: string
          nullable: true
          description: Valor a mandar em `thumbnailPath` do PUT
        defaultStillPreviewUrl:
          type: string
          nullable: true
          description: URL já dimensionada para preview no modal

    TmdbFilePairingSchemaSeason:
      type: object
      description: Temporada no schema de pairing
      properties:
        seasonNumber:
          type: integer
          format: int32
          nullable: true
          description: '`0` = specials'
        name:
          type: string
          nullable: true
        episodes:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TmdbFilePairingSchemaEpisode'

    TmdbFilePairingSchema:
      type: object
      description: |
        Estrutura da série TMDB vinculada — temporadas com episódios. Consumido pelo
        modal do PUT do pairing, para o cliente não precisar adivinhar temporada/episódio.
      properties:
        seasons:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TmdbFilePairingSchemaSeason'

    TmdbFilePairingRequest:
      type: object
      description: |
        Payload de PUT — descreve o estado completo do pairing. Todos campos opcionais;
        `null` zera aquela dimensão. Para remover a linha inteira use DELETE. Os campos
        `episode*` vêm prontos do `TmdbFilePairingSchemaEpisode` escolhido no modal — o
        servidor não rebusca no TMDB, só persiste o que o cliente mandar.
      properties:
        seasonNumber:
          type: integer
          format: int32
          nullable: true
        episodeNumber:
          type: integer
          format: int32
          nullable: true
        thumbnailPath:
          type: string
          nullable: true
          description: '`filePath` relativo do CDN do TMDB'
        episodeName:
          type: string
          nullable: true
        episodeOverview:
          type: string
          nullable: true
        episodeAirDate:
          type: string
          nullable: true
          description: Data de estreia ISO-8601
        episodeRuntime:
          type: integer
          format: int32
          nullable: true
          description: Duração em minutos
        episodeVoteAverage:
          type: number
          format: double
          nullable: true
        episodeVoteCount:
          type: integer
          format: int32
          nullable: true
        episodeType:
          type: string
          nullable: true
          description: 'Classificação do TMDB (ex.: `standard`, `finale`)'

    TmdbFilePairingResponse:
      type: object
      description: Pairing atual (campos `null` refletem estado parcial)
      properties:
        fileId:
          allOf: [{ $ref: '#/components/schemas/FileId' }]
          nullable: true
        seasonNumber:
          type: integer
          format: int32
          nullable: true
        episodeNumber:
          type: integer
          format: int32
          nullable: true
        thumbnailPath:
          type: string
          nullable: true
        thumbnailPreviewUrl:
          type: string
          nullable: true
          description: URL completa do CDN do TMDB, já pronta pra exibir (derivada de `thumbnailPath`)
        episodeName:
          type: string
          nullable: true
        episodeOverview:
          type: string
          nullable: true
        episodeAirDate:
          type: string
          nullable: true
          description: Data de estreia ISO-8601
        episodeRuntime:
          type: integer
          format: int32
          nullable: true
          description: Duração em minutos
        episodeVoteAverage:
          type: number
          format: double
          nullable: true
        episodeVoteCount:
          type: integer
          format: int32
          nullable: true
        episodeType:
          type: string
          nullable: true
          description: 'Classificação do TMDB (ex.: `standard`, `finale`)'

    # ---------- settings ----------
    SettingKey:
      type: string
      minLength: 1
      description: Identificador da preferência

    SettingValue:
      type: string
      description: Valor cru da preferência (interpretado pelo tipo no ponto de leitura)

    SettingResponse:
      type: object
      description: Preferência do admin; o `value` de preferências `secret` vem mascarado, nunca o valor cru
      required: [key, secret, configured, updatedAt]
      properties:
        key:
          $ref: '#/components/schemas/SettingKey'
        value:
          type: string
          nullable: true
          description: >-
            `***` quando `secret` é `true` (o valor cru nunca é ecoado); senão o valor cru, que
            pode ser `null` quando a preferência ainda não foi configurada
        secret:
          type: boolean
          description: >-
            `true` para preferências sensíveis (ex.: tokens) — o portal renderiza como senha
        configured:
          type: boolean
          description: >-
            `true` se há um valor não-vazio cadastrado (útil para secrets, cujo `value` é mascarado)
        updatedAt:
          type: string
          format: date-time
          description: Momento da última atualização

    UpdateSettingRequest:
      type: object
      description: Payload de `PUT /v1/settings/{key}`
      required: [value]
      properties:
        value:
          allOf: [{ $ref: '#/components/schemas/SettingValue' }]
          description: 'Novo valor; string vazia é permitida (ex.: limpar um secret)'

    SettingList:
      type: array
      description: Lista de preferências, ordenada pela chave
      items:
        $ref: '#/components/schemas/SettingResponse'

    # ---------- notification ----------
    NotificationLevel:
      type: string
      description: Severidade da notificação
      enum:
        - INFO
        - WARNING
        - ERROR

    NotificationResponse:
      type: object
      description: |
        Notificação de observabilidade — hoje geradas pela ingestão (conclusão, falha geral e
        falhas parciais do binding automático de cada título).
      required: [id, level, message, read, createdAt]
      properties:
        id:
          type: integer
          format: int32
          description: Id da notificação
        level:
          $ref: '#/components/schemas/NotificationLevel'
        message:
          type: string
          description: Texto pronto para exibir ao admin
        folderId:
          allOf: [{ $ref: '#/components/schemas/FolderId' }]
          nullable: true
          description: |
            Pasta do catalog do título a que a notificação se refere — o portal usa para linkar a
            revisão. `null` quando a notificação não é sobre um título (ex.: conclusão da
            ingestão).
        title:
          type: string
          nullable: true
          description: >-
            Título a que a notificação se refere; `null` nas mesmas condições de `folderId`
        coverImageUrl:
          type: string
          nullable: true
          description: URL da capa em tamanho pequeno (ícone); `null` quando não há capa conhecida
        read:
          type: boolean
          description: '`true` se o admin já marcou como lida'
        createdAt:
          type: string
          format: date-time
          description: Momento em que a notificação foi gerada

    NotificationPage:
      description: Envelope paginado de notificações
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/NotificationResponse'

    UnreadCountResponse:
      type: object
      description: Contagem de notificações não-lidas
      required: [count]
      properties:
        count:
          type: integer
          format: int32
